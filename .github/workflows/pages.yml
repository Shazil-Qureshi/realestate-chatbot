# Publishes the web/ folder to GitHub Pages when main is pushed (Task 3.4).
#
# Versions match GitHub's own starter workflow for Pages. upload-pages-artifact
# and deploy-pages have to agree on how the artifact is stored. A newer tag
# existing is not the same as it being compatible: upload-pages-artifact@v5
# exists, but deploy-pages@v5 could not read what it produced.
name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
